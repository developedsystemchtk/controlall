<!DOCTYPE html>
<html lang="th" class="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ระบบยืม-คืนครุภัณฑ์ — โรงพยาบาลสันทราย</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%234F46E5' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z'/%3E%3Cpath d='m3.3 7 8.7 5 8.7-5'/%3E%3Cpath d='M12 22V12'/%3E%3C/svg%3E" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Prompt:wght@300;400;500;600;700&amp;family=Sarabun:wght@400;500;600;700&amp;display=swap" rel="stylesheet" />

  
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Prompt', 'Inter', 'system-ui', '-apple-system', 'sans-serif'],
            sarabun: ['Sarabun', 'Prompt', 'sans-serif']
          },
          colors: {
            brand: {
              50: '#EEF2FF',
              100: '#E0E7FF',
              500: '#6366F1',
              600: '#4F46E5',
              700: '#4338CA'
            }
          }
        }
      }
    };
  </script>

  
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.395.0/dist/umd/lucide.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>

  <style>
    .hidden { display: none !important; }
    body {
      font-family: 'Prompt', 'Inter', system-ui, -apple-system, sans-serif;
      font-feature-settings: "cv02", "cv03", "cv04", "cv11";
    }
    .tabular-nums { font-variant-numeric: tabular-nums; }
    .hairline { border-color: rgba(15, 23, 42, 0.08); }
    .dark .hairline { border-color: rgba(255, 255, 255, 0.08); }

    .bg-grid-pattern {
      background-image: linear-gradient(to right, rgba(79, 70, 229, 0.045) 1px, transparent 1px),
                        linear-gradient(to bottom, rgba(79, 70, 229, 0.045) 1px, transparent 1px);
      background-size: 32px 32px;
    }

    
    .swal2-container {
      font-family: 'Prompt', 'Inter', sans-serif !important;
      z-index: 9999 !important;
    }
    .swal2-popup {
      background: #ffffff !important;
      color: #18181b !important;
      border: 1px solid rgba(15, 23, 42, 0.09) !important;
      border-radius: 0.75rem !important;
      box-shadow: 0 18px 40px -12px rgba(15, 23, 42, 0.16) !important;
      padding: 1.5rem !important;
      width: 24rem !important;
      max-width: calc(100vw - 2rem) !important;
    }
    html.dark .swal2-popup {
      background: #18181b !important;
      color: #fafafa !important;
      border-color: rgba(255, 255, 255, 0.1) !important;
      box-shadow: 0 20px 44px -12px rgba(0, 0, 0, 0.65) !important;
    }
    .swal2-title {
      font-size: 1rem !important;
      font-weight: 600 !important;
      color: inherit !important;
      padding: 0.35rem 0 0 0 !important;
      line-height: 1.4 !important;
    }
    .swal2-html-container {
      font-size: 0.8125rem !important;
      color: #71717a !important;
      margin: 0.45rem 0 0 0 !important;
      line-height: 1.55 !important;
    }
    html.dark .swal2-html-container {
      color: #a1a1aa !important;
    }
    .swal2-icon {
      transform: scale(0.76);
      margin: 0.15rem auto 0.25rem auto !important;
    }
    .swal2-input {
      font-family: 'Prompt', 'Inter', sans-serif !important;
      font-size: 0.8125rem !important;
      border: 1px solid rgba(15, 23, 42, 0.14) !important;
      border-radius: 0.5rem !important;
      height: 2.35rem !important;
      margin: 0.75rem 0 0 0 !important;
      box-shadow: none !important;
      background: #fafafa !important;
      color: #18181b !important;
    }
    html.dark .swal2-input {
      background: #09090b !important;
      border-color: rgba(255, 255, 255, 0.12) !important;
      color: #fafafa !important;
    }
    .swal2-input:focus {
      border-color: #4f46e5 !important;
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15) !important;
    }
    .swal2-actions {
      margin-top: 1.25rem !important;
      gap: 0.5rem !important;
      width: 100% !important;
    }
    .swal2-styled {
      font-family: 'Prompt', 'Inter', sans-serif !important;
      font-size: 0.75rem !important;
      font-weight: 500 !important;
      border-radius: 0.5rem !important;
      padding: 0.55rem 1rem !important;
      margin: 0 !important;
      box-shadow: none !important;
      transition: all 150ms ease !important;
    }
    .swal2-styled:focus { box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.22) !important; }
    .swal2-toast {
      width: auto !important;
      min-width: 16rem !important;
      max-width: 24rem !important;
      padding: 0.7rem 1rem !important;
      border-radius: 0.65rem !important;
    }
    .swal2-toast .swal2-title {
      font-size: 0.8125rem !important;
      font-weight: 500 !important;
      padding: 0 !important;
    }
    .swal2-timer-progress-bar {
      background: #4f46e5 !important;
      height: 2px !important;
    }
    .swal2-loader {
      border-color: #4f46e5 transparent #4f46e5 transparent !important;
    }

    
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(100, 116, 139, 0.28); border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(100, 116, 139, 0.48); }

    
    .gov-doc {
      font-family: 'Sarabun', 'Prompt', sans-serif;
      color: #111827;
      background: #ffffff;
    }
    #print-area { display: none; }
    @media print {
      body * { visibility: hidden !important; }
      #print-area, #print-area * { visibility: visible !important; }
      #print-area {
        display: block !important;
        position: absolute !important;
        left: 0 !important;
        top: 0 !important;
        width: 100% !important;
        background: #ffffff !important;
        color: #111827 !important;
        padding: 10mm 14mm !important;
      }
      @page { size: A4; margin: 10mm; }
      .no-print { display: none !important; }
    }
  </style>
</head>
<body class="bg-zinc-50 text-zinc-900 dark:bg-zinc-950 dark:text-zinc-100 antialiased selection:bg-brand-100 selection:text-brand-700">

  
  
  
  <div id="auth-screen" class="min-h-screen flex items-center justify-center p-4 bg-grid-pattern relative overflow-hidden">
    <div class="w-full max-w-md bg-white dark:bg-zinc-900 border hairline rounded-xl shadow-sm p-7 sm:p-8 relative z-10">
      
      <div class="flex items-center gap-3 mb-6">
        <div id="auth-logo-box" class="w-11 h-11 rounded-lg bg-brand-600 text-white flex items-center justify-center shadow-sm overflow-hidden shrink-0">
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg>
        </div>
        <div class="min-w-0">
          <h1 id="auth-app-title" class="text-lg font-semibold tracking-tight text-zinc-900 dark:text-white truncate">ระบบยืม-คืนครุภัณฑ์</h1>
          <p id="auth-app-subtitle" class="text-xs text-zinc-500 dark:text-zinc-400 truncate">โรงพยาบาลสันทราย</p>
        </div>
      </div>

      
      <div class="grid grid-cols-2 p-1 bg-zinc-100 dark:bg-zinc-800/80 rounded-lg mb-6 text-sm font-medium">
        <button id="tab-login-btn" type="button" onclick="switchAuthTab('login')" class="py-1.5 rounded-md bg-white dark:bg-zinc-900 text-zinc-900 dark:text-white shadow-xs transition">เข้าสู่ระบบ</button>
        <button id="tab-reg-btn" type="button" onclick="switchAuthTab('register')" class="py-1.5 rounded-md text-zinc-500 dark:text-zinc-400 hover:text-zinc-800 dark:hover:text-zinc-200 transition">ลงทะเบียนผู้ยืม</button>
      </div>

      
      <form id="login-form" action="javascript:void(0);" method="post" onsubmit="event.preventDefault(); handleLogin(event); return false;" class="space-y-4">
        <div>
          <label class="block text-xs font-medium text-zinc-700 dark:text-zinc-300 mb-1.5">ชื่อผู้ใช้งาน (Username)</label>
          <div class="relative">
            <svg class="w-4 h-4 text-zinc-400 absolute left-3 top-1/2 -translate-y-1/2 pointer-events-none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            <input id="login-username" type="text" required autocomplete="username" placeholder="กรอกชื่อผู้ใช้งาน" class="w-full pl-9 pr-3 py-2 text-sm bg-white dark:bg-zinc-950 border hairline rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-500/25 focus:border-brand-600 transition" />
          </div>
        </div>
        <div>
          <label class="block text-xs font-medium text-zinc-700 dark:text-zinc-300 mb-1.5">รหัสผ่าน (Password)</label>
          <div class="relative">
            <svg class="w-4 h-4 text-zinc-400 absolute left-3 top-1/2 -translate-y-1/2 pointer-events-none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <input id="login-password" type="password" required autocomplete="current-password" placeholder="กรอกรหัสผ่าน" class="w-full pl-9 pr-10 py-2 text-sm bg-white dark:bg-zinc-950 border hairline rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-500/25 focus:border-brand-600 transition" />
            <button type="button" onclick="togglePasswordVisibility('login-password', this)" class="absolute right-2.5 top-1/2 -translate-y-1/2 text-zinc-400 hover:text-zinc-600 dark:hover:text-zinc-200 p-1" aria-label="แสดง/ซ่อนรหัสผ่าน">
              <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>
        <div class="flex items-center justify-between text-xs">
          <label class="flex items-center gap-2 text-zinc-600 dark:text-zinc-400 cursor-pointer">
            <input id="login-remember" type="checkbox" checked class="rounded border-zinc-300 text-brand-600 focus:ring-brand-500" />
            จดจำการเข้าสู่ระบบ
          </label>
        </div>
        <button id="login-submit-btn" type="submit" class="w-full py-2.5 px-4 bg-brand-600 hover:bg-brand-700 text-white text-sm font-medium rounded-lg transition flex items-center justify-center gap-2">
          <span>เข้าสู่ระบบ</span>
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
        </button>
      </form>

      
      <form id="register-form" action="javascript:void(0);" method="post" onsubmit="event.preventDefault(); handleRegister(event); return false;" class="space-y-3.5 hidden">
        <div>
          <label class="block text-xs font-medium text-zinc-700 dark:text-zinc-300 mb-1">ชื่อ-นามสกุล</label>
          <input id="reg-fullname" type="text" required placeholder="เช่น นายสมศักดิ์ ใจดี" class="w-full px-3 py-2 text-sm bg-white dark:bg-zinc-950 border hairline rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-500/25 focus:border-brand-600" />
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-medium text-zinc-700 dark:text-zinc-300 mb-1">Username</label>
            <input id="reg-username" type="text" required placeholder="ภาษาอังกฤษ" class="w-full px-3 py-2 text-sm bg-white dark:bg-zinc-950 border hairline rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-500/25 focus:border-brand-600" />
          </div>
          <div>
            <label class="block text-xs font-medium text-zinc-700 dark:text-zinc-300 mb-1">รหัสผ่าน</label>
            <input id="reg-password" type="password" required minlength="8" autocomplete="new-password" placeholder="อย่างน้อย 8 ตัว" class="w-full px-3 py-2 text-sm bg-white dark:bg-zinc-950 border hairline rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-500/25 focus:border-brand-600" />
          </div>
        </div>
        <div>
          <label class="block text-xs font-medium text-zinc-700 dark:text-zinc-300 mb-1">สังกัดหน่วยงาน / แผนก</label>
          <select id="reg-dept" class="w-full px-3 py-2 text-sm bg-white dark:bg-zinc-950 border hairline rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-500/25 focus:border-brand-600"><option value="">กำลังโหลดรายชื่อหน่วยงาน...</option></select>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-medium text-zinc-700 dark:text-zinc-300 mb-1">อีเมล</label>
            <input id="reg-email" type="email" placeholder="name@example.com" class="w-full px-3 py-2 text-sm bg-white dark:bg-zinc-950 border hairline rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-500/25 focus:border-brand-600" />
          </div>
          <div>
            <label class="block text-xs font-medium text-zinc-700 dark:text-zinc-300 mb-1">เบอร์ติดต่อ</label>
            <input id="reg-phone" type="text" placeholder="08x-xxx-xxxx" class="w-full px-3 py-2 text-sm bg-white dark:bg-zinc-950 border hairline rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-500/25 focus:border-brand-600" />
          </div>
        </div>
        <button type="submit" class="w-full py-2.5 px-4 bg-brand-600 hover:bg-brand-700 text-white text-sm font-medium rounded-lg transition">
          สมัครสมาชิกและเข้าใช้งาน
        </button>
      </form>
    </div>
  </div>

  
  
  
  <div id="app-shell" class="hidden min-h-screen flex bg-zinc-50 dark:bg-zinc-950">

    
    <div id="sidebar-backdrop" onclick="toggleMobileSidebar(false)" class="fixed inset-0 bg-zinc-950/40 z-30 hidden lg:hidden"></div>

    
    <aside id="sidebar" class="fixed lg:sticky top-0 left-0 z-40 h-screen w-64 bg-white dark:bg-zinc-900 border-r hairline flex flex-col transition-all duration-200 -translate-x-full lg:translate-x-0">
      
      <div class="h-14 px-4 border-b hairline flex items-center justify-between shrink-0">
        <div class="flex items-center gap-2.5 overflow-hidden">
          <div id="sidebar-logo-box" class="w-8 h-8 rounded-lg bg-brand-600 text-white flex items-center justify-center shrink-0 overflow-hidden">
            <i data-lucide="boxes" class="w-4 h-4"></i>
          </div>
          <div class="sidebar-label truncate">
            <div id="sidebar-app-title" class="text-sm font-semibold tracking-tight text-zinc-900 dark:text-white leading-tight truncate">ระบบยืม-คืนครุภัณฑ์</div>
            <div id="sidebar-org-name" class="text-[10px] text-zinc-500 truncate">โรงพยาบาลสันทราย</div>
          </div>
        </div>
        <button onclick="toggleSidebarCollapse()" class="hidden lg:flex p-1.5 rounded-md text-zinc-400 hover:text-zinc-700 dark:hover:text-zinc-200 hover:bg-zinc-100 dark:hover:bg-zinc-800" title="ย่อ/ขยายเมนู">
          <i data-lucide="panel-left-close" class="w-4 h-4"></i>
        </button>
      </div>

      
      <nav id="sidebar-nav" class="flex-1 overflow-y-auto p-3 space-y-1 text-sm"></nav>

      
      <div class="p-3 border-t hairline shrink-0">
        <div class="flex items-center gap-2.5 p-2 rounded-lg bg-zinc-50 dark:bg-zinc-800/60 border hairline">
          <div id="user-avatar" class="w-8 h-8 rounded-full bg-brand-600 text-white text-xs font-semibold flex items-center justify-center shrink-0">U</div>
          <div class="sidebar-label min-w-0 flex-1">
            <div id="user-fullname" class="text-xs font-medium text-zinc-900 dark:text-white truncate">-</div>
            <div id="user-role-dept" class="text-[10px] text-zinc-500 truncate">-</div>
          </div>
          <button onclick="handleLogout()" class="p-1.5 text-zinc-400 hover:text-rose-600 rounded-md hover:bg-rose-50 dark:hover:bg-rose-500/10 transition" title="ออกจากระบบ">
            <i data-lucide="log-out" class="w-4 h-4"></i>
          </button>
        </div>
      </div>
    </aside>

    
    <div class="flex-1 min-w-0 flex flex-col">
      
      <header class="sticky top-0 z-20 h-14 bg-white/85 dark:bg-zinc-900/85 backdrop-blur-md border-b hairline px-4 sm:px-6 flex items-center justify-between gap-3">
        <div class="flex items-center gap-3 min-w-0">
          <button onclick="toggleMobileSidebar(true)" class="lg:hidden p-1.5 rounded-md border hairline text-zinc-600 dark:text-zinc-300">
            <i data-lucide="menu" class="w-5 h-5"></i>
          </button>
          <div class="min-w-0">
            <h2 id="page-title" class="text-sm sm:text-base font-semibold tracking-tight text-zinc-900 dark:text-white truncate">แดชบอร์ดภาพรวม</h2>
          </div>
        </div>

        <div class="flex items-center gap-2">
          
          <div class="hidden md:flex items-center relative">
            <i data-lucide="search" class="w-3.5 h-3.5 text-zinc-400 absolute left-2.5"></i>
            <input id="global-search-input" type="text" oninput="handleGlobalSearch(this.value)" placeholder="ค้นหารหัส/ชื่อครุภัณฑ์..." class="w-52 lg:w-64 pl-8 pr-3 py-1.5 text-xs bg-zinc-100/80 dark:bg-zinc-800 border border-transparent focus:border-brand-500 focus:bg-white dark:focus:bg-zinc-950 rounded-lg outline-none transition" />
          </div>

          
          <button onclick="navigate('scanner')" class="inline-flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg border hairline text-xs font-medium text-zinc-700 dark:text-zinc-200 hover:bg-zinc-100 dark:hover:bg-zinc-800 transition">
            <i data-lucide="qr-code" class="w-3.5 h-3.5 text-brand-600"></i>
            <span class="hidden sm:inline">สแกน QR</span>
          </button>

          
          <button onclick="reloadAllData(true)" class="p-1.5 rounded-lg border hairline text-zinc-600 dark:text-zinc-300 hover:bg-zinc-100 dark:hover:bg-zinc-800 transition" title="รีเฟรชข้อมูล">
            <i data-lucide="refresh-cw" class="w-4 h-4"></i>
          </button>

          
          <div class="relative">
            <button onclick="toggleNotificationPopover()" class="p-1.5 rounded-lg border hairline text-zinc-600 dark:text-zinc-300 hover:bg-zinc-100 dark:hover:bg-zinc-800 transition relative" title="การแจ้งเตือน">
              <i data-lucide="bell" class="w-4 h-4"></i>
              <span id="notif-dot" class="hidden absolute -top-1 -right-1 w-4 h-4 rounded-full bg-rose-600 text-white text-[10px] font-bold flex items-center justify-center">0</span>
            </button>
            <div id="notif-popover" class="hidden absolute right-0 mt-2 w-80 bg-white dark:bg-zinc-900 border hairline rounded-xl shadow-lg p-3 z-50">
              <div class="flex items-center justify-between pb-2 mb-2 border-b hairline">
                <span class="text-xs font-semibold flex items-center gap-1.5">
                  <i data-lucide="bell-ring" class="w-3.5 h-3.5 text-brand-600"></i> แจ้งเตือนระบบ
                </span>
                <button onclick="toggleNotificationPopover(false)" class="text-xs text-zinc-400 hover:text-zinc-600 dark:hover:text-zinc-200">ปิด</button>
              </div>
              <div id="notif-list" class="space-y-2 max-h-64 overflow-y-auto text-xs"></div>
            </div>
          </div>

          
          <button onclick="toggleTheme()" class="p-1.5 rounded-lg border hairline text-zinc-600 dark:text-zinc-300 hover:bg-zinc-100 dark:hover:bg-zinc-800 transition" title="สลับโหมดสี">
            <i id="theme-icon" data-lucide="moon" class="w-4 h-4"></i>
          </button>
        </div>
      </header>

      
      <main id="main-content" class="flex-1 p-4 sm:p-6 max-w-[1440px] w-full mx-auto"></main>
    </div>
  </div>

  <script>
    
    const BTN_PRIMARY = 'inline-flex items-center justify-center gap-1.5 px-4 py-2 rounded-lg bg-brand-600 hover:bg-brand-700 text-white text-xs font-medium transition focus:outline-none focus:ring-2 focus:ring-brand-500/30';
    const BTN_DANGER = 'inline-flex items-center justify-center gap-1.5 px-4 py-2 rounded-lg bg-rose-600 hover:bg-rose-700 text-white text-xs font-medium transition focus:outline-none focus:ring-2 focus:ring-rose-500/30';
    const BTN_SUCCESS = 'inline-flex items-center justify-center gap-1.5 px-4 py-2 rounded-lg bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-medium transition focus:outline-none focus:ring-2 focus:ring-emerald-500/30';
    const BTN_SECONDARY = 'inline-flex items-center justify-center gap-1.5 px-3.5 py-2 rounded-lg border hairline bg-white dark:bg-zinc-900 text-zinc-700 dark:text-zinc-200 hover:bg-zinc-50 dark:hover:bg-zinc-800 text-xs font-medium transition';

    const _memStore = new Map();
    const safeStorage = {
      get(storeType, key) {
        try {
          const st = storeType === 'local' ? window.localStorage : window.sessionStorage;
          return st.getItem(key);
        } catch (e) {
          return _memStore.get(storeType + ':' + key) ?? null;
        }
      },
      set(storeType, key, val) {
        _memStore.set(storeType + ':' + key, String(val));
        try {
          const st = storeType === 'local' ? window.localStorage : window.sessionStorage;
          st.setItem(key, String(val));
        } catch (e) {}
      },
      remove(storeType, key) {
        _memStore.delete(storeType + ':' + key);
        try {
          const st = storeType === 'local' ? window.localStorage : window.sessionStorage;
          st.removeItem(key);
        } catch (e) {}
      }
    };

    function refreshIcons() {
      try {
        if (typeof lucide !== 'undefined' && typeof lucide.createIcons === 'function') {
          lucide.createIcons();
        }
      } catch (e) {}
    }

    const swalClassBase = {
      popup: 'border hairline rounded-xl',
      confirmButton: BTN_PRIMARY,
      cancelButton: BTN_SECONDARY
    };

    const Toast = {
      fire({ icon = 'info', title = '' } = {}) {
        if (typeof Swal !== 'undefined') {
          return Swal.mixin({
            toast: true,
            position: 'top-end',
            showConfirmButton: false,
            timer: 2600,
            timerProgressBar: true,
            customClass: { popup: 'border hairline rounded-xl' }
          }).fire({ icon, title });
        }
        const el = document.createElement('div');
        el.className = 'fixed top-4 right-4 z-[9999] px-4 py-2.5 rounded-xl bg-white dark:bg-zinc-900 border hairline shadow-lg text-xs font-medium text-zinc-900 dark:text-white';
        el.textContent = title;
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 2600);
      }
    };

    function closeLoading() {
      try {
        if (typeof Swal !== 'undefined') Swal.close();
      } catch (e) {}
    }

    function uiAlert(icon, title, text = '') {
      if (typeof Swal !== 'undefined') {
        return Swal.fire({
          icon,
          title,
          text,
          confirmButtonText: 'รับทราบ',
          buttonsStyling: false,
          customClass: swalClassBase
        });
      }
      alert((title ? title + '\n' : '') + (text || ''));
      return Promise.resolve({ isConfirmed: true });
    }

    function uiConfirm({ title, text = '', icon = 'question', confirmText = 'ยืนยัน', cancelText = 'ยกเลิก', danger = false }) {
      if (typeof Swal !== 'undefined') {
        return Swal.fire({
          icon,
          title,
          text,
          showCancelButton: true,
          confirmButtonText: confirmText,
          cancelButtonText: cancelText,
          reverseButtons: true,
          buttonsStyling: false,
          customClass: {
            popup: 'border hairline rounded-xl',
            confirmButton: danger ? BTN_DANGER : BTN_PRIMARY,
            cancelButton: BTN_SECONDARY
          }
        });
      }
      return Promise.resolve({ isConfirmed: confirm((title || '') + (text ? '\n' + text : '')) });
    }

    function uiPrompt({ title, label = '', placeholder = '', confirmText = 'ยืนยัน', danger = false }) {
      if (typeof Swal !== 'undefined') {
        return Swal.fire({
          title,
          input: 'text',
          inputLabel: label,
          inputPlaceholder: placeholder,
          showCancelButton: true,
          confirmButtonText: confirmText,
          cancelButtonText: 'ยกเลิก',
          reverseButtons: true,
          buttonsStyling: false,
          customClass: {
            popup: 'border hairline rounded-xl',
            confirmButton: danger ? BTN_DANGER : BTN_PRIMARY,
            cancelButton: BTN_SECONDARY
          }
        });
      }
      const val = prompt(title + (label ? '\n' + label : ''), '');
      return Promise.resolve(val === null ? { isConfirmed: false } : { isConfirmed: true, value: val });
    }

    function uiLoading(text = 'กำลังดำเนินการ...') {
      if (typeof Swal !== 'undefined') {
        Swal.fire({
          title: text,
          allowOutsideClick: false,
          showConfirmButton: false,
          customClass: { popup: 'border hairline rounded-xl' },
          didOpen: () => Swal.showLoading()
        });
      }
    }

    
    function esc(v) {
      return String(v === null || v === undefined ? '' : v)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function todayStr(offsetDays = 0) {
      const d = new Date();
      d.setDate(d.getDate() + offsetDays);
      return d.toISOString().slice(0, 10);
    }

    function nowStr() {
      const d = new Date();
      return d.toISOString().slice(0, 19).replace('T', ' ');
    }

    const THAI_MONTHS = [
      'มกราคม', 'กุมภาพันธ์', 'มีนาคม', 'เมษายน', 'พฤษภาคม', 'มิถุนายน',
      'กรกฎาคม', 'สิงหาคม', 'กันยายน', 'ตุลาคม', 'พฤศจิกายน', 'ธันวาคม'
    ];

    function fmtThaiDate(isoStr) {
      if (!isoStr) return '-';
      const m = String(isoStr).match(/^(\d{4})-(\d{2})-(\d{2})/);
      if (!m) return isoStr;
      const y = parseInt(m[1], 10) + 543;
      const month = THAI_MONTHS[parseInt(m[2], 10) - 1] || '';
      const day = parseInt(m[3], 10);
      return `${day} ${month} ${y}`;
    }

    function fmtMoney(n) {
      return Number(n || 0).toLocaleString('th-TH', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
    }

    function diffDays(startIso, endIso) {
      if (!startIso || !endIso) return 0;
      const s = new Date(String(startIso).slice(0, 10) + 'T00:00:00');
      const e = new Date(String(endIso).slice(0, 10) + 'T00:00:00');
      if (isNaN(s.getTime()) || isNaN(e.getTime())) return 0;
      return Math.round((e.getTime() - s.getTime()) / 86400000);
    }

    function calcBorrowMetrics(b) {
      if (!b) return { plannedDays: 1, actualDays: 1, overdueDays: 0, remainingDays: 0, elapsedDays: 0, isOverdueNow: false, isReturnedLate: false, isAnyOverdue: false, isApproved: false, approvalText: '-', daySummaryHtml: '-' };
      const today = todayStr(0);
      const start = String(b.BorrowDate || '').slice(0, 10);
      const due = String(b.DueDate || '').slice(0, 10);
      const ret = String(b.ReturnDate || '').slice(0, 10);
      const plannedDays = Math.max(1, diffDays(start, due || start));
      const actualDays = Number(b.BorrowDays) || Math.max(1, diffDays(start, ret || due || start));
      const isReturnedLate = Boolean(b.Status === 'คืนแล้ว' && ret && due && ret > due);
      const isOverdueNow = Boolean((b.Status === 'กำลังยืม' || b.Status === 'อนุมัติแล้ว') && due && today > due);

      let overdueDays = 0;
      if (isReturnedLate) {
        overdueDays = Math.max(1, diffDays(due, ret));
      } else if (isOverdueNow) {
        overdueDays = Math.max(1, diffDays(due, today));
      } else if (Number(b.OverdueDays || 0) > 0) {
        overdueDays = Number(b.OverdueDays);
      }

      const isAnyOverdue = overdueDays > 0 || isOverdueNow || isReturnedLate || String(b.OverdueStatus || '').includes('เกินกำหนด');
      const remainingDays = (!isOverdueNow && due && today <= due) ? Math.max(0, diffDays(today, due)) : 0;
      const elapsedDays = start ? Math.max(1, diffDays(start, ret || today)) : 1;
      const isApproved = ['อนุมัติแล้ว', 'กำลังยืม', 'คืนแล้ว'].includes(b.Status) || b.ApprovalStatus === 'อนุมัติเรียบร้อยแล้ว' || Boolean(b.ApproverName && b.Status !== 'ปฏิเสธ' && b.Status !== 'ยกเลิก');
      const approvalText = isApproved ? 'อนุมัติเรียบร้อยแล้ว' : (b.Status === 'ปฏิเสธ' ? 'ไม่อนุมัติ' : (b.Status === 'ยกเลิก' ? 'ยกเลิก' : 'รออนุมัติ'));

      let daySummaryHtml = '';
      if (b.Status === 'คืนแล้ว') {
        if (isAnyOverdue) {
          daySummaryHtml = `<div class="text-[11px] font-semibold text-rose-600 dark:text-rose-400">ยืมจริง ${actualDays} วัน (กำหนด ${plannedDays} วัน) • เกินกำหนด +${overdueDays} วัน</div>`;
        } else {
          daySummaryHtml = `<div class="text-[11px] font-medium text-emerald-700 dark:text-emerald-400">ยืมจริง ${actualDays} วัน • คืนตามกำหนด</div>`;
        }
      } else if (b.Status === 'กำลังยืม' || b.Status === 'อนุมัติแล้ว') {
        if (isAnyOverdue) {
          daySummaryHtml = `<div class="text-[11px] font-semibold text-rose-600 dark:text-rose-400">กำหนด ${plannedDays} วัน (ยืมมาแล้ว ${elapsedDays} วัน) • เกินกำหนด +${overdueDays} วัน</div>`;
        } else if (today < start) {
          const waitDays = diffDays(today, start);
          daySummaryHtml = `<div class="text-[11px] font-medium text-indigo-600 dark:text-indigo-400">ยืมรวม ${plannedDays} วัน • เริ่มยืมในอีก ${waitDays} วัน</div>`;
        } else {
          daySummaryHtml = `<div class="text-[11px] font-medium text-sky-700 dark:text-sky-300">ยืมรวม ${plannedDays} วัน • ยืมมาแล้ว ${elapsedDays} วัน (เหลือ ${remainingDays} วัน)</div>`;
        }
      } else {
        daySummaryHtml = `<div class="text-[11px] text-zinc-500">ขอยืมรวม ${plannedDays} วัน</div>`;
      }

      return {
        plannedDays,
        actualDays,
        overdueDays,
        remainingDays,
        elapsedDays,
        isOverdueNow,
        isReturnedLate,
        isAnyOverdue,
        isApproved,
        approvalText,
        daySummaryHtml
      };
    }

    function isOverdue(borrow) {
      return calcBorrowMetrics(borrow).isAnyOverdue;
    }

    function isBorrowApproved(borrow) {
      return calcBorrowMetrics(borrow).isApproved;
    }

    // อ่านรูป -> ย่อขนาด -> data URL (เซิร์ฟเวอร์จำกัดไม่เกิน ~700KB และไม่รับ SVG)
    function readFileAsBase64(file, opts = {}) {
      return new Promise((resolve) => {
        if (!file) return resolve('');
        const fail = (msg) => { uiAlert('error', 'แนบรูปไม่สำเร็จ', msg); resolve(''); };
        if (!/^image\//.test(file.type)) return fail('รองรับเฉพาะไฟล์รูปภาพ (PNG/JPG/WEBP/GIF/SVG)');
        const reader = new FileReader();
        reader.onerror = () => fail('อ่านไฟล์ไม่สำเร็จ');
        reader.onload = () => {
          const img = new Image();
          img.onerror = () => fail('เปิดไฟล์รูปไม่สำเร็จ');
          img.onload = () => {
            const w0 = img.naturalWidth || img.width || 256;
            const h0 = img.naturalHeight || img.height || 256;
            const alpha = /png|svg|gif|webp/.test(file.type) && opts.keepAlpha !== false;
            const render = (max, type, q) => {
              const k = Math.min(1, max / Math.max(w0, h0));
              const c = document.createElement('canvas');
              c.width = Math.max(1, Math.round(w0 * k));
              c.height = Math.max(1, Math.round(h0 * k));
              const ctx = c.getContext('2d');
              if (type === 'image/jpeg') { ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height); }
              ctx.drawImage(img, 0, 0, c.width, c.height);
              return c.toDataURL(type, q);
            };
            const max = opts.max || 800;
            const tries = [
              () => render(max, alpha ? 'image/png' : 'image/jpeg', 0.75),
              () => render(Math.min(max, 640), 'image/jpeg', 0.6),
              () => render(Math.min(max, 480), 'image/jpeg', 0.5)
            ];
            for (const t of tries) {
              const out = t();
              if (out.length <= 450000) return resolve(out);
            }
            fail('รูปมีขนาดใหญ่เกินไป กรุณาเลือกรูปที่เล็กลง');
          };
          img.src = reader.result;
        };
        reader.readAsDataURL(file);
      });
    }

    
    const SESSION_KEY = 'sansai_asset_session_v1';
    const CFG = window.APP_CONFIG || {};

    // ชื่อฟังก์ชันที่หน้าเว็บเรียก -> RPC บน Supabase (ทุกตัวตรวจ token/สิทธิ์ที่ฝั่งฐานข้อมูล)
    const RPC_MAP = {
      getPublicBranding:  { rpc: 'rpc_get_public_branding',   auth: false, params: () => ({}) },
      loginUser:          { rpc: 'rpc_login_user',            auth: false, params: (u, p, remember) => ({ p_username: u, p_password: p, p_remember: remember !== false }) },
      registerUser:       { rpc: 'rpc_register_user',         auth: false, params: (payload) => ({ p_payload: payload }) },
      logout:             { rpc: 'rpc_logout',                auth: true,  params: () => ({}) },
      getInitialData:     { rpc: 'rpc_get_initial_data',      auth: true,  params: () => ({}) },
      saveDepartment:     { rpc: 'rpc_save_department',       auth: true,  params: (payload) => ({ p_payload: payload }) },
      deleteDepartment:   { rpc: 'rpc_delete_department',     auth: true,  params: (id) => ({ p_id: id }) },
      saveUser:           { rpc: 'rpc_save_user',             auth: true,  params: (payload) => ({ p_payload: payload }) },
      deleteUser:         { rpc: 'rpc_delete_user',           auth: true,  params: (id) => ({ p_id: id }) },
      saveAsset:          { rpc: 'rpc_save_asset',            auth: true,  params: (payload) => ({ p_payload: payload }) },
      deleteAsset:        { rpc: 'rpc_delete_asset',          auth: true,  params: (id) => ({ p_id: id }) },
      createBorrowRequest:{ rpc: 'rpc_create_borrow_request', auth: true,  params: (payload) => ({ p_payload: payload }) },
      processBorrowAction:{ rpc: 'rpc_process_borrow_action', auth: true,  params: (payload) => ({ p_payload: payload }) },
      saveMaintenance:    { rpc: 'rpc_save_maintenance',      auth: true,  params: (payload) => ({ p_payload: payload }) },
      disposeAsset:       { rpc: 'rpc_dispose_asset',         auth: true,  params: (payload) => ({ p_payload: payload }) },
      saveSettings:       { rpc: 'rpc_save_settings',         auth: true,  params: (map) => ({ p_map: map }) }
    };

    async function callBackend(fnName, ...args) {
      const def = RPC_MAP[fnName];
      if (!def) throw new Error('ไม่รู้จักคำสั่ง: ' + fnName);
      if (!CFG.SUPABASE_URL || !CFG.SUPABASE_KEY) throw new Error('ยังไม่ได้ตั้งค่า config.js (SUPABASE_URL / SUPABASE_KEY)');
      // หมายเหตุ: อาร์กิวเมนต์ "ผู้ใช้" (state.user) ที่ส่งมาท้ายสุดถูกทิ้งโดยตั้งใจ — เซิร์ฟเวอร์ระบุตัวตนจาก token เท่านั้น
      const body = def.params(...args);
      if (def.auth) body.p_token = state.token || '';
      let resp;
      try {
        resp = await fetch(CFG.SUPABASE_URL.replace(/\/+$/, '') + '/rest/v1/rpc/' + def.rpc, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'apikey': CFG.SUPABASE_KEY },
          body: JSON.stringify(body)
        });
      } catch (e) {
        throw new Error('เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ กรุณาตรวจสอบอินเทอร์เน็ตแล้วลองใหม่');
      }
      let json = null;
      try { json = await resp.json(); } catch (e) {}
      if (!resp.ok) {
        const detail = json && (json.message || json.hint);
        throw new Error('เซิร์ฟเวอร์ตอบกลับผิดพลาด' + (detail ? ': ' + detail : ' (' + resp.status + ')'));
      }
      if (json && json.code === 'unauthorized' && def.auth && fnName !== 'logout') handleSessionExpired();
      return json;
    }

    function persistSession() {
      const payload = JSON.stringify({ token: state.token, user: state.user });
      if (safeStorage.get('local', SESSION_KEY)) safeStorage.set('local', SESSION_KEY, payload);
      else if (safeStorage.get('session', SESSION_KEY)) safeStorage.set('session', SESSION_KEY, payload);
    }

    function handleSessionExpired() {
      if (!state.user) return;
      state.user = null;
      state.token = null;
      safeStorage.remove('local', SESSION_KEY);
      safeStorage.remove('session', SESSION_KEY);
      try { stopQRScanner(); } catch (e) {}
      document.getElementById('app-shell').classList.add('hidden');
      document.getElementById('auth-screen').classList.remove('hidden');
      closeLoading();
      uiAlert('warning', 'เซสชันหมดอายุ', 'กรุณาเข้าสู่ระบบใหม่อีกครั้ง');
    }

    // เปิดรูปที่เก็บเป็น data URL (เบราว์เซอร์บล็อกการนำทางไป data: โดยตรง จึงแปลงเป็น blob ก่อน)
    function openImageData(url) {
      if (!url) return;
      if (/^data:/i.test(url)) {
        try {
          const head = url.slice(0, url.indexOf(','));
          const mime = (head.match(/^data:([^;]+)/i) || [])[1] || 'image/jpeg';
          const bin = atob(url.slice(url.indexOf(',') + 1));
          const arr = new Uint8Array(bin.length);
          for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
          window.open(URL.createObjectURL(new Blob([arr], { type: mime })), '_blank', 'noopener');
          return;
        } catch (e) {}
      }
      if (/^https:\/\//i.test(url)) window.open(url, '_blank', 'noopener');
    }

    function openBorrowPhoto(borrowId, which) {
      const b = (state.data.borrows || []).find(x => x.BorrowID === borrowId);
      if (!b) return;
      openImageData(which === 'before' ? b.BeforePhotoUrl : b.AfterPhotoUrl);
    }

    const state = {
      user: null,
      token: null,
      route: 'dashboard',
      sidebarCollapsed: false,
      globalSearch: '',
      pendingLogoBase64: null,
      clearLogoFlag: false,
      data: {
        users: [],
        departments: [],
        assets: [],
        borrows: [],
        maintenances: [],
        disposals: [],
        logs: [],
        settings: {}
      },
      filters: {
        catalogDept: 'ALL',
        catalogCat: 'ALL',
        catalogStatus: 'ALL',
        approvalTab: 'รออนุมัติ',
        approvalDept: 'ALL',
        summaryTab: 'by_person',
        summaryPerson: 'ALL',
        summaryAsset: 'ALL',
        summaryDept: 'ALL',
        summarySearch: '',
        assetDept: 'ALL',
        assetStatus: 'ALL',
        selectedAssetIds: new Set(),
        reportType: 'assets_summary',
        reportDept: 'ALL',
        reportFrom: todayStr(-30),
        reportTo: todayStr(0),
        reportFormat: 'memo'
      },
      charts: {},
      qrScannerInstance: null
    };

    const ROLE_LABELS = {
      SuperAdmin: 'ผู้ดูแลระบบสูงสุด',
      DeptAdmin: 'ผู้ดูแลครุภัณฑ์หน่วยงาน',
      Approver: 'ผู้อนุมัติ/หัวหน้า',
      Borrower: 'ผู้ยืม/เจ้าหน้าที่'
    };

    function isSuperAdmin() { return state.user?.Role === 'SuperAdmin'; }
    function isDeptAdmin() { return state.user?.Role === 'DeptAdmin'; }
    function isApprover() { return state.user?.Role === 'Approver'; }
    function canManageAssets() { return isSuperAdmin() || isDeptAdmin(); }
    function canApproveOrReturn() { return isSuperAdmin() || isDeptAdmin() || isApprover(); }

    function scopedAssets() {
      if (isSuperAdmin()) return state.data.assets;
      if (isDeptAdmin()) return state.data.assets.filter(a => a.DepartmentID === state.user.DepartmentID);
      return state.data.assets;
    }

    function scopedBorrows() {
      if (canApproveOrReturn()) return state.data.borrows;
      return state.data.borrows.filter(b => b.BorrowerID === state.user.UserID);
    }

    
    function applyBranding(settings = {}, departments = []) {
      const appTitle = settings.AppTitle || 'ระบบยืม-คืนครุภัณฑ์';
      const appSub = settings.AppSubtitle || 'โรงพยาบาลสันทราย';
      const orgName = settings.OrgName || 'โรงพยาบาลสันทราย';
      const logoUrl = settings.LogoUrl || '';

      document.title = `${appTitle} — ${appSub}`;

    document.addEventListener('DOMContentLoaded', async () => {
      initTheme();
      refreshIcons();

      try {
        const pub = await callBackend('getPublicBranding');
        if (pub && pub.ok) {
          applyBranding(pub.settings || {}, pub.departments || []);
        }
      } catch (e) {}

      const savedSession = safeStorage.get('local', SESSION_KEY) || safeStorage.get('session', SESSION_KEY);
      if (savedSession) {
        try {
          const saved = JSON.parse(savedSession);
          if (!saved || !saved.token || !saved.user) throw new Error('invalid session');
          state.user = saved.user;
          state.token = saved.token;
          await enterAppShell();
        } catch (e) {
          safeStorage.remove('local', SESSION_KEY);
          safeStorage.remove('session', SESSION_KEY);
        }
      }
      refreshIcons();
    });

    window.addEventListener('unhandledrejection', (ev) => {
      closeLoading();
      console.error('Unhandled rejection:', ev.reason);
    });

    function initTheme() {
      const t = safeStorage.get('local', 'sansai_asset_theme') || 'light';
      document.documentElement.classList.toggle('dark', t === 'dark');
      updateThemeIcon();
    }

    function toggleTheme() {
      const isDark = document.documentElement.classList.toggle('dark');
      safeStorage.set('local', 'sansai_asset_theme', isDark ? 'dark' : 'light');
      updateThemeIcon();
      if (state.route === 'dashboard') renderDashboardCharts();
    }

    function updateThemeIcon() {
      const icon = document.getElementById('theme-icon');
      if (!icon) return;
      const isDark = document.documentElement.classList.contains('dark');
      icon.setAttribute('data-lucide', isDark ? 'sun' : 'moon');
      refreshIcons();
    }

    
    function switchAuthTab(tab) {
      const isLogin = tab === 'login';
      document.getElementById('login-form').classList.toggle('hidden', !isLogin);
      document.getElementById('register-form').classList.toggle('hidden', isLogin);
      document.getElementById('tab-login-btn').className = isLogin

    function togglePasswordVisibility(inputId, btn) {
      const el = document.getElementById(inputId);

    async function handleLogin(e) {
      if (e && e.preventDefault) e.preventDefault();
      if (e && e.stopPropagation) e.stopPropagation();
      const username = document.getElementById('login-username').value.trim();
      const password = document.getElementById('login-password').value;
      const remember = document.getElementById('login-remember').checked;

      uiLoading('กำลังตรวจสอบสิทธิ์...');
      try {
        const res = await callBackend('loginUser', username, password, remember);
        closeLoading();
        if (!res || !res.ok) {
          uiAlert('error', 'เข้าสู่ระบบไม่สำเร็จ', (res && res.message) || 'ไม่ได้รับการตอบกลับจากเซิร์ฟเวอร์');
          return false;
        }
        state.user = res.user;
        state.token = res.token;
        safeStorage.set(remember ? 'local' : 'session', SESSION_KEY, JSON.stringify({ token: res.token, user: res.user }));
        const entered = await enterAppShell();
        if (entered) {
          Toast.fire({ icon: 'success', title: `ยินดีต้อนรับ ${res.user.FullName}` });
        }
      } catch (err) {
        closeLoading();
        uiAlert('error', 'เกิดข้อผิดพลาด', err && err.message ? err.message : String(err));
      }
      return false;
    }

    async function handleRegister(e) {
      if (e && e.preventDefault) e.preventDefault();
      if (e && e.stopPropagation) e.stopPropagation();
      const payload = {
        FullName: document.getElementById('reg-fullname').value.trim(),
        Username: document.getElementById('reg-username').value.trim(),
        Password: document.getElementById('reg-password').value,
        DepartmentID: document.getElementById('reg-dept').value,
        Email: document.getElementById('reg-email').value.trim(),
        Phone: document.getElementById('reg-phone').value.trim()
      };
      uiLoading('กำลังลงทะเบียน...');
      try {
        const res = await callBackend('registerUser', payload);
        closeLoading();
        if (!res || !res.ok) {
          uiAlert('error', 'ลงทะเบียนไม่สำเร็จ', (res && res.message) || 'ไม่สามารถลงทะเบียนได้');
          return false;
        }
        state.user = res.user;
        state.token = res.token;
        safeStorage.set('local', SESSION_KEY, JSON.stringify({ token: res.token, user: res.user }));
        const entered = await enterAppShell();
        if (entered) {
          Toast.fire({ icon: 'success', title: 'ลงทะเบียนสำเร็จ' });
        }
      } catch (err) {
        closeLoading();
        uiAlert('error', 'เกิดข้อผิดพลาด', err && err.message ? err.message : String(err));
      }
      return false;
    }

    async function handleLogout() {
      const r = await uiConfirm({
        title: 'ออกจากระบบ?',
        text: 'คุณต้องการออกจากระบบใช่หรือไม่',
        icon: 'question',
        confirmText: 'ออกจากระบบ',
        danger: true
      });
      if (r.isConfirmed) {
        stopQRScanner();
        try { await callBackend('logout'); } catch (e) {}
        state.user = null;
        state.token = null;
        safeStorage.remove('local', SESSION_KEY);
        safeStorage.remove('session', SESSION_KEY);
        document.getElementById('app-shell').classList.add('hidden');
        document.getElementById('auth-screen').classList.remove('hidden');
        refreshIcons();
      }
    }

    
    async function enterAppShell() {
      try {
        uiLoading('กำลังโหลดข้อมูลระบบ...');
        const res = await callBackend('getInitialData');
        closeLoading();
        if (!res || !res.ok || !res.data) {
          throw new Error((res && res.message) || 'ไม่สามารถดึงข้อมูลฐานข้อมูลได้');
        }
        state.data = res.data;
        if (res.data.me) { state.user = res.data.me; persistSession(); }

        document.getElementById('user-fullname').textContent = state.user.FullName || '-';
        document.getElementById('user-role-dept').textContent = `${ROLE_LABELS[state.user.Role] || state.user.Role} • ${state.user.DepartmentName || ''}`;
        document.getElementById('user-avatar').textContent = (state.user.FullName || 'U').charAt(0).toUpperCase();

        document.getElementById('auth-screen').classList.add('hidden');
        document.getElementById('app-shell').classList.remove('hidden');

        applyBranding(state.data.settings || {}, state.data.departments || []);
        updateNotifications();
        renderSidebar();
        navigate('dashboard');
        refreshIcons();
        return true;
      } catch (err) {
        closeLoading();
        uiAlert('error', 'เข้าสู่หน้าหลักไม่สำเร็จ', err && err.message ? err.message : String(err));
        return false;
      }
    }

    async function reloadAllData(showToast = false) {
      try {
        const res = await callBackend('getInitialData');
        if (!res || !res.ok || !res.data) throw new Error((res && res.message) || 'โหลดข้อมูลไม่สำเร็จ');
        state.data = res.data;
        applyBranding(state.data.settings || {}, state.data.departments || []);
        updateNotifications();
        renderSidebar();
        renderCurrentView();
        refreshIcons();
        if (showToast) Toast.fire({ icon: 'success', title: 'อัปเดตข้อมูลล่าสุดแล้ว' });
      } catch (err) {
        uiAlert('error', 'โหลดข้อมูลล้มเหลว', err && err.message ? err.message : String(err));
      }
    }

      const items = [
        { id: 'dashboard', label: 'แดชบอร์ดภาพรวม', icon: 'layout-dashboard', show: true },

        { id: 'my_borrows', label: 'รายการยืม-คืนของฉัน', icon: 'clipboard-list', show: true },

    function renderSidebar() {
      const nav = document.getElementById('sidebar-nav');
      const items = getNavItems();
      nav.innerHTML = items.map(item => {
        if (item.section) {
          return `<div class="sidebar-label px-3 pt-4 pb-1 text-[10px] font-semibold uppercase tracking-wider text-zinc-400">${esc(item.section)}</div>`;
        }
        const active = state.route === item.id;
        return `
          <button onclick="navigate('${item.id}')" class="w-full flex items-center justify-between px-3 py-2 rounded-lg text-left transition ${
            active
              ? 'bg-brand-50 text-brand-700 font-medium dark:bg-brand-500/15 dark:text-brand-100'
              : 'text-zinc-600 dark:text-zinc-400 hover:bg-zinc-100 dark:hover:bg-zinc-800/70 hover:text-zinc-900 dark:hover:text-zinc-100'
          }">
            <span class="flex items-center gap-2.5 min-w-0">
              <i data-lucide="${item.icon}" class="w-4 h-4 shrink-0 ${active ? 'text-brand-600 dark:text-brand-400' : ''}"></i>
              <span class="sidebar-label truncate">${esc(item.label)}</span>
            </span>
            ${item.badge ? `<span class="sidebar-label px-1.5 py-0.5 text-[10px] font-semibold rounded-full bg-rose-100 text-rose-700 dark:bg-rose-500/20 dark:text-rose-300">${item.badge}</span>` : ''}
          </button>
        `;
      }).join('');
      refreshIcons();
    }

    function navigate(routeId) {
      if (state.route === 'scanner' && routeId !== 'scanner') {
        stopQRScanner();
      }
      state.route = routeId;
      toggleMobileSidebar(false);
      const navItem = getNavItems().find(i => i.id === routeId);
      document.getElementById('page-title').textContent = navItem ? navItem.label : (state.data.settings?.AppTitle || 'ระบบยืม-คืนครุภัณฑ์');
      renderSidebar();
      renderCurrentView();
      if (routeId === 'scanner') {
        startQRScanner();
      }
    }

    function toggleMobileSidebar(open) {
      const sb = document.getElementById('sidebar');
      const bd = document.getElementById('sidebar-backdrop');
      if (open) {
        sb.classList.remove('-translate-x-full');
        bd.classList.remove('hidden');
      } else {
        sb.classList.add('-translate-x-full');
        bd.classList.add('hidden');
      }
    }

    function toggleSidebarCollapse() {
      const sb = document.getElementById('sidebar');
      state.sidebarCollapsed = !state.sidebarCollapsed;
      sb.classList.toggle('w-64', !state.sidebarCollapsed);
      sb.classList.toggle('w-[72px]', state.sidebarCollapsed);
      sb.querySelectorAll('.sidebar-label').forEach(el => el.classList.toggle('hidden', state.sidebarCollapsed));
    }

    function handleGlobalSearch(val) {
      state.globalSearch = val.trim().toLowerCase();
      if (['catalog', 'assets', 'approvals', 'my_borrows', 'borrow_summary'].includes(state.route)) {
        renderCurrentView();
      } else if (state.globalSearch.length >= 2) {
        navigate('catalog');
      }
    }

    function updateNotifications() {
      const overdue = state.data.borrows.filter(b => isOverdue(b));
      const pending = canApproveOrReturn() ? scopedBorrows().filter(b => b.Status === 'รออนุมัติ') : [];
      const total = overdue.length + pending.length;
      const dot = document.getElementById('notif-dot');
      dot.textContent = total;
      dot.classList.toggle('hidden', total === 0);

      const list = document.getElementById('notif-list');
      const rows = [];
      overdue.forEach(b => {
        rows.push(`<div onclick="navigate('${canApproveOrReturn() ? 'approvals' : 'my_borrows'}');toggleNotificationPopover(false)" class="p-2.5 rounded-lg bg-rose-50/80 dark:bg-rose-500/10 border border-rose-200/70 dark:border-rose-500/20 cursor-pointer hover:border-rose-300 transition">
          <div class="font-medium text-rose-700 dark:text-rose-300 flex items-center gap-1.5">
            <span class="w-1.5 h-1.5 rounded-full bg-rose-600 shrink-0"></span> เกินกำหนด: ${esc(b.AssetName)}
          </div>
          <div class="text-[11px] text-rose-600/80 dark:text-rose-400 mt-0.5 pl-3">ผู้ยืม: ${esc(b.BorrowerName)} • กำหนด ${esc(b.DueDate)}</div>
        </div>`);
      });
      pending.forEach(b => {
        rows.push(`<div onclick="navigate('approvals');toggleNotificationPopover(false)" class="p-2.5 rounded-lg bg-amber-50/80 dark:bg-amber-500/10 border border-amber-200/70 dark:border-amber-500/20 cursor-pointer hover:border-amber-300 transition">
          <div class="font-medium text-amber-800 dark:text-amber-300 flex items-center gap-1.5">
            <span class="w-1.5 h-1.5 rounded-full bg-amber-500 shrink-0"></span> รออนุมัติ: ${esc(b.RequestCode)}
          </div>
          <div class="text-[11px] text-amber-700/80 dark:text-amber-400 mt-0.5 pl-3">${esc(b.BorrowerName)} ขอยืม ${esc(b.AssetCode)}</div>
        </div>`);
      });
      list.innerHTML = rows.length ? rows.join('') : '<div class="text-center py-6 text-zinc-400">ไม่มีแจ้งเตือนค้าง</div>';
    }

    function toggleNotificationPopover(force) {
      const pop = document.getElementById('notif-popover');
      if (typeof force === 'boolean') pop.classList.toggle('hidden', !force);
      else pop.classList.toggle('hidden');
    }

    function statusBadge(status, overdueFlag = false, borrowObj = null) {
      const map = {
        'พร้อมให้ยืม': 'bg-emerald-50 text-emerald-700 border-emerald-200 dark:bg-emerald-500/15 dark:text-emerald-300 dark:border-emerald-500/20',
        'Active': 'bg-emerald-50 text-emerald-700 border-emerald-200 dark:bg-emerald-500/15 dark:text-emerald-300 dark:border-emerald-500/20',
        'คืนแล้ว': 'bg-emerald-50 text-emerald-700 border-emerald-200 dark:bg-emerald-500/15 dark:text-emerald-300 dark:border-emerald-500/20',
        'ซ่อมเสร็จ': 'bg-emerald-50 text-emerald-700 border-emerald-200 dark:bg-emerald-500/15 dark:text-emerald-300 dark:border-emerald-500/20',
        'ถูกยืม': 'bg-sky-50 text-sky-700 border-sky-200 dark:bg-sky-500/15 dark:text-sky-300 dark:border-sky-500/20',
        'กำลังยืม': 'bg-sky-50 text-sky-700 border-sky-200 dark:bg-sky-500/15 dark:text-sky-300 dark:border-sky-500/20',
        'จองแล้ว': 'bg-indigo-50 text-indigo-700 border-indigo-200 dark:bg-indigo-500/15 dark:text-indigo-300 dark:border-indigo-500/20',
        'อนุมัติแล้ว': 'bg-indigo-50 text-indigo-700 border-indigo-200 dark:bg-indigo-500/15 dark:text-indigo-300 dark:border-indigo-500/20',
        'รออนุมัติ': 'bg-amber-50 text-amber-700 border-amber-200 dark:bg-amber-500/15 dark:text-amber-300 dark:border-amber-500/20',
        'แจ้งซ่อม': 'bg-amber-50 text-amber-700 border-amber-200 dark:bg-amber-500/15 dark:text-amber-300 dark:border-amber-500/20',
        'กำลังซ่อม': 'bg-amber-50 text-amber-700 border-amber-200 dark:bg-amber-500/15 dark:text-amber-300 dark:border-amber-500/20',
        'ส่งซ่อม': 'bg-amber-50 text-amber-700 border-amber-200 dark:bg-amber-500/15 dark:text-amber-300 dark:border-amber-500/20',
        'ปฏิเสธ': 'bg-rose-50 text-rose-700 border-rose-200 dark:bg-rose-500/15 dark:text-rose-300 dark:border-rose-500/20',
        'ตัดจำหน่าย': 'bg-zinc-100 text-zinc-600 border-zinc-200 dark:bg-zinc-800 dark:text-zinc-400 dark:border-zinc-700',
        'รอตัดจำหน่าย': 'bg-rose-50 text-rose-700 border-rose-200 dark:bg-rose-500/15 dark:text-rose-300 dark:border-rose-500/20',
        'ซ่อมไม่ได้-รอตัดจำหน่าย': 'bg-rose-50 text-rose-700 border-rose-200 dark:bg-rose-500/15 dark:text-rose-300 dark:border-rose-500/20',
        'ยกเลิก': 'bg-zinc-100 text-zinc-500 border-zinc-200 dark:bg-zinc-800 dark:text-zinc-400 dark:border-zinc-700',
        'Inactive': 'bg-zinc-100 text-zinc-500 border-zinc-200 dark:bg-zinc-800 dark:text-zinc-400 dark:border-zinc-700'
      };
      const cls = map[status] || 'bg-zinc-100 text-zinc-700 border-zinc-200';
      const mainBadge = `<span class="inline-flex items-center px-2 py-0.5 rounded-full text-[11px] font-medium border ${cls}">${esc(status)}</span>`;

      if (!borrowObj && !overdueFlag) return mainBadge;

      const m = borrowObj ? calcBorrowMetrics(borrowObj) : null;
      const isOvr = overdueFlag || (m && m.isAnyOverdue);
      const ovrDays = m ? m.overdueDays : 0;
      const badges = [mainBadge];

      if (m && m.isApproved && status !== 'อนุมัติแล้ว') {
        badges.push(`<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[10px] font-medium bg-indigo-50 text-indigo-700 border border-indigo-200 dark:bg-indigo-500/15 dark:text-indigo-300 dark:border-indigo-500/20">อนุมัติเรียบร้อยแล้ว</span>`);
      }
      if (isOvr) {
        badges.push(`<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[11px] font-semibold bg-rose-50 text-rose-700 border border-rose-200 dark:bg-rose-500/15 dark:text-rose-300 dark:border-rose-500/25"><span class="w-1.5 h-1.5 rounded-full bg-rose-600"></span>เกินกำหนด${ovrDays > 0 ? ' (+' + ovrDays + ' วัน)' : ''}</span>`);
      }
      return `<div class="flex flex-wrap items-center gap-1">${badges.join('')}</div>`;
    }

    function kpiCard(title, value, sub, icon, colorCls) {
      return `
        <div class="bg-white dark:bg-zinc-900 border hairline rounded-xl p-4">

        </div>
      `;

    function renderDashboardCharts() {
      if (typeof Chart === 'undefined') return;
      const isDark = document.documentElement.classList.contains('dark');
      const gridColor = isDark ? 'rgba(255,255,255,0.07)' : 'rgba(15,23,42,0.06)';
      const textColor = isDark ? '#A1A1AA' : '#52525B';

      Object.values(state.charts).forEach(c => c && c.destroy());

      const ctxDept = document.getElementById('chart-dept');
      if (ctxDept) {
        const depts = state.data.departments;
        const labels = depts.map(d => d.DeptCode || d.DeptName);
        const totalByDept = depts.map(d => state.data.assets.filter(a => a.DepartmentID === d.DeptID).length);
        const borrowedByDept = depts.map(d => state.data.assets.filter(a => a.DepartmentID === d.DeptID && a.Status === 'ถูกยืม').length);

        state.charts.dept = new Chart(ctxDept, {
          type: 'bar',
          data: {
            labels,
            datasets: [
              { label: 'ครุภัณฑ์ทั้งหมด', data: totalByDept, backgroundColor: '#4F46E5', borderRadius: 6 },
              { label: 'กำลังถูกยืม', data: borrowedByDept, backgroundColor: '#0EA5E9', borderRadius: 6 }
            ]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { labels: { color: textColor, font: { family: 'Prompt', size: 11 } } } },
            scales: {
              x: { grid: { display: false }, ticks: { color: textColor, font: { family: 'Prompt', size: 11 } } },
              y: { beginAtZero: true, ticks: { stepSize: 1, color: textColor }, grid: { color: gridColor } }
            }
          }
        });
      }

      const ctxStatus = document.getElementById('chart-status');
      if (ctxStatus) {
        const statuses = ['พร้อมให้ยืม', 'ถูกยืม', 'จองแล้ว', 'ส่งซ่อม', 'ตัดจำหน่าย'];
        const counts = statuses.map(s => state.data.assets.filter(a => a.Status === s).length);
        state.charts.status = new Chart(ctxStatus, {
          type: 'doughnut',
          data: {
            labels: statuses,
            datasets: [{
              data: counts,
              backgroundColor: ['#10B981', '#0EA5E9', '#6366F1', '#F59E0B', '#71717A'],
              borderWidth: 0
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            cutout: '66%',
            plugins: { legend: { position: 'bottom', labels: { color: textColor, boxWidth: 10, font: { family: 'Prompt', size: 11 } } } }
          }
        });
      }
    }

          ${filtered.length === 0 ? `

    async function submitBorrowRequest(e, assetId) {
      e.preventDefault();
      const payload = {
        AssetID: assetId,
        BorrowDate: document.getElementById('brw-start').value,
        DueDate: document.getElementById('brw-due').value,
        Purpose: document.getElementById('brw-purpose').value.trim(),
        LocationUse: document.getElementById('brw-loc').value.trim(),
        Remarks: document.getElementById('brw-remarks').value.trim()
      };
      if (payload.DueDate < payload.BorrowDate) {
        return uiAlert('warning', 'วันที่ไม่ถูกต้อง', 'วันส่งคืนต้องไม่น้อยกว่าวันที่เริ่มยืม');
      }
      uiLoading('กำลังบันทึกคำขอยืม...');
      const res = await callBackend('createBorrowRequest', payload, state.user);
      closeLoading();
      if (!res.ok) return uiAlert('error', 'ไม่สำเร็จ', res.message);
      closeModal();
      if (canApproveOrReturn()) {
        state.filters.approvalTab = res.status === 'รออนุมัติ' ? 'รออนุมัติ' : 'อนุมัติแล้ว';
        state.route = 'approvals';
      } else {
        state.route = 'my_borrows';
      }
      await reloadAllData(false);
      navigate(state.route);
      uiAlert('success', 'บันทึกคำขอยืมสำเร็จ', `เลขที่คำขอ: ${res.requestCode} • สถานะ: ${res.status}`);
    }

    function startFrameDecodeLoop() {
      if (state.qrFrameTimer) clearInterval(state.qrFrameTimer);
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d', { willReadFrequently: true });
      let detector = null;
      try {
        if (typeof BarcodeDetector !== 'undefined') {
          detector = new BarcodeDetector({ formats: ['qr_code', 'code_128', 'code_39', 'ean_13'] });
        }
      } catch (e) {}

      state.qrFrameTimer = setInterval(async () => {
        const vid = document.getElementById('qr-inline-video');
        if (!vid || vid.readyState < 2 || !vid.videoWidth) return;
        canvas.width = vid.videoWidth;
        canvas.height = vid.videoHeight;
        ctx.drawImage(vid, 0, 0, canvas.width, canvas.height);

        if (detector) {
          try {
            const codes = await detector.detect(canvas);
            if (codes && codes.length > 0 && codes[0].rawValue) {
              window.onExternalQRScanned(codes[0].rawValue);
              return;
            }
          } catch (e) {}
        }
        if (typeof jsQR !== 'undefined') {
          try {
            const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const code = jsQR(imgData.data, imgData.width, imgData.height);
            if (code && code.data) {
              window.onExternalQRScanned(code.data);
              return;
            }
          } catch (e) {}
        }
      }, 140);
    }

    function startQRScanner() {
      const box = document.getElementById('qr-reader-box');
      if (!box) return;
      stopQRScanner();
      box.innerHTML = '<div class="p-6 text-center text-xs text-zinc-300">กำลังเปิดกล้องและขออนุญาตใช้งานกล้องอัตโนมัติ...</div>';

      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        openCameraPermissionBridge();
        return;
      }

      navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } } })
        .catch(() => navigator.mediaDevices.getUserMedia({ video: true }))
        .then(stream => {
          window.attachLiveCameraStream(stream, null);
        })
        .catch(() => {
          openCameraPermissionBridge();
        });
    }

    function stopQRScanner() {
      if (state.qrFrameTimer) {
        clearInterval(state.qrFrameTimer);
        state.qrFrameTimer = null;
      }
      if (state.activeMediaStream) {
        try {
          state.activeMediaStream.getTracks().forEach(t => t.stop());
        } catch (e) {}
        state.activeMediaStream = null;
      }
      if (state.cameraBridgeWin) {
        try {
          if (!state.cameraBridgeWin.closed) state.cameraBridgeWin.close();
        } catch (e) {}
        state.cameraBridgeWin = null;
      }
      if (state.qrScannerInstance) {
        try {
          state.qrScannerInstance.stop().then(() => state.qrScannerInstance.clear()).catch(() => {});
        } catch (e) {}
        state.qrScannerInstance = null;
      }
      const badge = document.getElementById('qr-cam-badge');
      if (badge) {
        badge.textContent = 'ปิดกล้องแล้ว';
        badge.className = 'px-2 py-0.5 rounded-full text-[11px] font-medium bg-zinc-100 text-zinc-600 border border-zinc-200';
      }
    }

    function scanQRFromImageFile(input) {
      const file = input.files && input.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          canvas.width = img.width;
          canvas.height = img.height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0);
          if (typeof jsQR !== 'undefined') {
            const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const code = jsQR(imgData.data, imgData.width, imgData.height);
            if (code && code.data) {
              window.onExternalQRScanned(code.data);
              input.value = '';
              return;
            }
          }
          uiAlert('warning', 'ไม่พบ QR Code ในภาพ', 'กรุณาถ่ายภาพ QR Code ให้ชัดเจน หรือเลือกรหัสครุภัณฑ์จากรายการด่วน');
          input.value = '';
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    }

    async function cancelBorrow(borrowId) {
      const c = await uiConfirm({ title: 'ยืนยันยกเลิกคำขอ?', text: 'คำขอนี้จะถูกเปลี่ยนสถานะเป็นยกเลิก', icon: 'warning', confirmText: 'ยืนยันยกเลิก', danger: true });
      if (!c.isConfirmed) return;
      uiLoading();
      const res = await callBackend('processBorrowAction', { BorrowID: borrowId, action: 'cancel' }, state.user);
      closeLoading();
      if (!res.ok) return uiAlert('error', 'ไม่สำเร็จ', res.message);
      Toast.fire({ icon: 'success', title: 'ยกเลิกคำขอแล้ว' });
      reloadAllData(false);
    }

    function matchApprovalTab(b, tab) {
      if (tab === 'ทั้งหมด') return true;
      if (tab === 'รออนุมัติ') return b.Status === 'รออนุมัติ';
      if (tab === 'อนุมัติแล้ว') return isBorrowApproved(b);
      if (tab === 'กำลังยืม') return b.Status === 'กำลังยืม' || b.Status === 'อนุมัติแล้ว';
      if (tab === 'เกินกำหนด') return isOverdue(b);
      if (tab === 'คืนแล้ว') return b.Status === 'คืนแล้ว';
      return b.Status === tab;
    }

    async function submitApprove(e, borrowId) {
      e.preventDefault();
      const file = document.getElementById('app-photo').files[0];
      const photoB64 = file ? await readFileAsBase64(file) : '';
      uiLoading('กำลังบันทึกการอนุมัติ...');
      const res = await callBackend('processBorrowAction', {
        BorrowID: borrowId,
        action: document.getElementById('app-mode').value,
        ConditionBefore: document.getElementById('app-cond').value.trim(),
        PhotoBase64: photoB64
      }, state.user);
      closeLoading();
      if (!res.ok) return uiAlert('error', 'ไม่สำเร็จ', res.message);
      closeModal();
      state.filters.approvalTab = 'อนุมัติแล้ว';
      await reloadAllData(false);
      Toast.fire({ icon: 'success', title: 'อนุมัติเรียบร้อยแล้ว' });
    }

    async function submitHandover(e, borrowId) {
      e.preventDefault();
      const file = document.getElementById('ho-photo').files[0];
      const photoB64 = file ? await readFileAsBase64(file) : '';
      uiLoading();
      const res = await callBackend('processBorrowAction', {
        BorrowID: borrowId,
        action: 'handover',
        ConditionBefore: document.getElementById('ho-cond').value.trim(),
        PhotoBase64: photoB64
      }, state.user);
      closeLoading();
      if (!res.ok) return uiAlert('error', 'ไม่สำเร็จ', res.message);
      closeModal();
      Toast.fire({ icon: 'success', title: 'ส่งมอบครุภัณฑ์แล้ว' });
      reloadAllData(false);
    }

      const { value: reason } = await uiPrompt({
        title: 'ปฏิเสธคำขอยืม',
        label: 'ระบุเหตุผลที่ไม่อนุมัติ',
        placeholder: 'เช่น ครุภัณฑ์ติดภารกิจงานเร่งด่วน',
        confirmText: 'ยืนยันปฏิเสธ',
        danger: true
      });
      if (reason === undefined) return;
      uiLoading();
      const res = await callBackend('processBorrowAction', { BorrowID: borrowId, action: 'reject', RejectReason: reason }, state.user);
      closeLoading();
      if (!res.ok) return uiAlert('error', 'ไม่สำเร็จ', res.message);
      Toast.fire({ icon: 'success', title: 'ปฏิเสธคำขอแล้ว' });
      reloadAllData(false);

      const file = document.getElementById('ret-photo').files[0];
      const photoB64 = file ? await readFileAsBase64(file) : '';
      const isDamaged = document.getElementById('ret-damaged').checked;
      uiLoading('กำลังบันทึกรับคืน...');
      const res = await callBackend('processBorrowAction', {
        BorrowID: borrowId,
        action: 'return',
        ReturnDate: document.getElementById('ret-date').value,
        ConditionAfter: document.getElementById('ret-cond').value,
        isDamaged,
        DamageDetail: document.getElementById('ret-damage-detail').value.trim(),
        Remarks: document.getElementById('ret-remarks').value.trim(),
        PhotoBase64: photoB64
      }, state.user);
      closeLoading();
      if (!res.ok) return uiAlert('error', 'ไม่สำเร็จ', res.message);
      closeModal();
      Toast.fire({ icon: 'success', title: isDamaged ? 'รับคืนและเปิดใบแจ้งซ่อมแล้ว' : 'รับคืนครุภัณฑ์เรียบร้อย' });

    }

    async function submitAssetForm(e, assetId) {
      e.preventDefault();
      const old = assetId ? state.data.assets.find(x => x.AssetID === assetId) : null;
      const file = document.getElementById('ast-img').files[0];
      const imgB64 = file ? await readFileAsBase64(file) : '';
      const payload = {
        AssetID: assetId || '',
        AssetCode: document.getElementById('ast-code').value.trim(),
        SerialNo: document.getElementById('ast-serial').value.trim(),
        AssetName: document.getElementById('ast-name').value.trim(),
        Category: document.getElementById('ast-cat').value.trim(),
        BrandModel: document.getElementById('ast-brand').value.trim(),
        DepartmentID: document.getElementById('ast-dept').value,
        Location: document.getElementById('ast-loc').value.trim(),
        PurchaseDate: document.getElementById('ast-date').value,
        Price: Number(document.getElementById('ast-price').value || 0),
        Status: document.getElementById('ast-status').value,
        Condition: document.getElementById('ast-cond').value.trim(),
        Notes: document.getElementById('ast-notes').value.trim(),
        ImageUrl: old?.ImageUrl || '',
        ImageBase64: imgB64
      };
      uiLoading('กำลังบันทึกครุภัณฑ์...');
      const res = await callBackend('saveAsset', payload, state.user);
      closeLoading();

      closeModal();
      Toast.fire({ icon: 'success', title: 'บันทึกครุภัณฑ์เรียบร้อย' });
      reloadAllData(false);
    }

    function exportWorkbook(target) {
      if (typeof XLSX === 'undefined') return uiAlert('error', 'ไม่พบไลบรารี SheetJS');
      const wb = XLSX.utils.book_new();
      const map = {
        assets: { name: 'Assets', rows: state.data.assets },
        borrows: { name: 'BorrowRequests', rows: state.data.borrows },
        maintenances: { name: 'MaintenanceLogs', rows: state.data.maintenances },
        disposals: { name: 'DisposalLogs', rows: state.data.disposals },
        logs: { name: 'ActivityLogs', rows: state.data.logs }
      };
      const keys = target === 'ALL' ? Object.keys(map) : [target];
      keys.forEach(k => {
        const ws = XLSX.utils.json_to_sheet(map[k].rows.length ? map[k].rows : [{}]);
        XLSX.utils.book_append_sheet(wb, ws, map[k].name);
      });
      XLSX.writeFile(wb, `Sansai_Asset_Report_${todayStr(0)}.xlsx`);
      Toast.fire({ icon: 'success', title: 'ดาวน์โหลดไฟล์ Excel สำเร็จ' });

      if (!b64) { input.value = ''; return; }
      state.pendingLogoBase64 = b64;
      state.clearLogoFlag = false;
      const prev = document.getElementById('set-logo-preview');
      if (prev) {
        prev.innerHTML = `<img src="${esc(b64)}" alt="Preview Logo" class="w-full h-full object-contain p-1" />`;
      }

    async function submitSettings(e) {
      e.preventDefault();
      uiLoading('กำลังบันทึกการตั้งค่า...');
      const currentLogo = state.clearLogoFlag ? '' : (state.data.settings?.LogoUrl || '');
      const payload = {
        AppTitle: document.getElementById('set-apptitle').value.trim(),
        AppSubtitle: document.getElementById('set-appsub').value.trim(),
        OrgName: document.getElementById('set-org').value.trim(),
        OrgPhone: document.getElementById('set-phone').value.trim(),
        OrgAddress: document.getElementById('set-addr').value.trim(),
        LogoUrl: currentLogo,
        DocPrefix: document.getElementById('set-docprefix').value.trim(),
        Signer1Name: document.getElementById('set-s1-name').value.trim(),
        Signer1Position: document.getElementById('set-s1-pos').value.trim(),
        Signer2Name: document.getElementById('set-s2-name').value.trim(),
        Signer2Position: document.getElementById('set-s2-pos').value.trim(),
        Signer3Name: document.getElementById('set-s3-name').value.trim(),
        Signer3Position: document.getElementById('set-s3-pos').value.trim(),
        MaxBorrowDays: document.getElementById('set-days').value,
        RequireApproval: document.getElementById('set-req').value,
        AllowCrossDeptBorrow: document.getElementById('set-cross').value,
        OverdueAlertNote: document.getElementById('set-note').value.trim()
      };
      if (state.pendingLogoBase64) {
        payload.LogoBase64 = state.pendingLogoBase64;
      }

      const res = await callBackend('saveSettings', payload, state.user);
      closeLoading();
      if (!res.ok) return uiAlert('error', 'ไม่สำเร็จ', res.message);
      Toast.fire({ icon: 'success', title: 'บันทึกการตั้งค่าทั้งหมดแล้ว' });
      reloadAllData(false);
    }

                <td class="border border-zinc-500 px-2 py-2 font-medium">${esc(b.AssetName)}</td>
                <td class="border border-zinc-500 px-2 py-2">${esc(b.ConditionBefore || '-')}</td>
                <td class="border border-zinc-500 px-2 py-2">${esc(b.ConditionAfter || '-')}</td>
                <td class="border border-zinc-500 px-2 py-2">${b.ReturnDate ? fmtThaiDate(b.ReturnDate) : '-'}</td>
              </tr>
            </tbody>
          </table>

          <div class="grid grid-cols-3 gap-4 pt-6 text-center">
            <div>
              <div class="border-b border-dotted border-zinc-500 h-10"></div>
              <div class="mt-1 font-medium">(${esc(b.BorrowerName)})</div>
              <div class="text-[11px] text-zinc-500">ผู้ขอยืม / ผู้รับมอบ</div>
            </div>
            <div>
              <div class="border-b border-dotted border-zinc-500 h-10"></div>
              <div class="mt-1 font-medium">(${esc(b.ApproverName || s.Signer3Name || '........................................')})</div>
              <div class="text-[11px] text-zinc-500">ผู้อนุมัติ</div>
            </div>
            <div>
              <div class="border-b border-dotted border-zinc-500 h-10"></div>
              <div class="mt-1 font-medium">(${esc(b.ReceiverName || s.Signer1Name || '........................................')})</div>
              <div class="text-[11px] text-zinc-500">เจ้าหน้าที่ผู้ตรวจรับคืน</div>
            </div>
          </div>
          ${footNote ? `<div class="mt-5 pt-2 border-t border-zinc-200 text-[10px] text-zinc-500">หมายเหตุ: ${esc(footNote)}</div>` : ''}
        </div>
      `;

      document.getElementById('print-area').innerHTML = html;
      openModal(`ตัวอย่างพิมพ์ใบยืม-คืน (${b.RequestCode})`, `
        <div class="space-y-3">
          ${html}
          <div class="flex justify-end gap-2">
            <button onclick="closeModal()" class="${BTN_SECONDARY}">ปิด</button>
            <button onclick="window.print()" class="${BTN_PRIMARY}"><i data-lucide="printer" class="w-3.5 h-3.5"></i> สั่งพิมพ์ / Save PDF</button>
          </div>
        </div>
      `);
    }

    function openPrintStickersModal(assetIds) {
      const items = state.data.assets.filter(a => assetIds.includes(a.AssetID));
      if (!items.length) return;
      const cardsHtml = `
        <div class="grid grid-cols-2 sm:grid-cols-3 gap-3 bg-white text-zinc-900 p-2">
          ${items.map((a, idx) => `
            <div class="border border-zinc-400 rounded-md p-2.5 flex items-center gap-2.5 break-inside-avoid">
              <div id="stk-qr-${idx}" class="shrink-0"></div>
              <div class="min-w-0 text-[10px] leading-tight">
                <div class="font-bold font-mono text-[11px] truncate">${esc(a.AssetCode)}</div>
                <div class="font-medium line-clamp-2 mt-0.5">${esc(a.AssetName)}</div>
                <div class="text-zinc-500 truncate mt-0.5">${esc(a.DepartmentName)}</div>
              </div>
            </div>
          `).join('')}
        </div>
      `;
      openModal(`พิมพ์สติกเกอร์ QR Code (${items.length} ดวง)`, `
        <div class="space-y-3">
          <div id="sticker-preview-wrap">${cardsHtml}</div>
          <div class="flex justify-end gap-2">
            <button onclick="closeModal()" class="${BTN_SECONDARY}">ปิด</button>
            <button onclick="triggerStickerPrint()" class="${BTN_PRIMARY}"><i data-lucide="printer" class="w-3.5 h-3.5"></i> สั่งพิมพ์สติกเกอร์</button>
          </div>
        </div>
      `);

      setTimeout(() => {
        items.forEach((a, idx) => {
          const el = document.getElementById(`stk-qr-${idx}`);
          if (el && typeof QRCode !== 'undefined') {
            el.innerHTML = '';
            new QRCode(el, { text: a.QRCodeValue || a.AssetCode, width: 64, height: 64 });
          }
        });
      }, 50);
    }

    function triggerStickerPrint() {
      const wrap = document.getElementById('sticker-preview-wrap');
      if (wrap) {
        document.getElementById('print-area').innerHTML = wrap.innerHTML;
        window.print();
      }
    }

    
    function openModal(title, bodyHtml) {
      document.getElementById('modal-title').textContent = title;
      document.getElementById('modal-body').innerHTML = bodyHtml;
      const root = document.getElementById('modal-root');
      root.classList.remove('hidden');
      root.classList.add('flex');
      refreshIcons();
    }

    function closeModal() {
      const root = document.getElementById('modal-root');
      root.classList.add('hidden');
      root.classList.remove('flex');
    }
  </script>
</body>
</html>
